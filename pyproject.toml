[build-system]
requires = [
  "scikit-build-core>=0.11",  # PEP 639 license metadata
  "Cython>=3.0",
  "numpy>=1.22",        # the Cython extension compiles against NumPy
]
build-backend = "scikit_build_core.build"

[project]
name = "Aarambam"
version = "1.1.0"
description = "Aarambam: 2LPT + basis tools"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Dhayaa" }]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.12",        # cg(rtol=) in basis/legendre/cmbbest.pyx
  "tqdm",
  "joblib",
  "threadpoolctl",
]

[project.scripts]
aarambam = "Aarambam.cli:main"
# Older names, kept as aliases (ResBasis runs the modal 2LPTBasis executable)
Aarambam-2LPT-Basis    = "Aarambam.cli:lpt_basis"
Aarambam-2LPT-ResBasis = "Aarambam.cli:lpt_resbasis"
Aarambam-2LPT-Binned   = "Aarambam.cli:lpt_binned"
Aarambam-camb2input          = "Aarambam.cli:camb2input_main"
Aarambam-collate-potential   = "Aarambam.cli:collate_main"
Aarambam-make-example-config-basis    = "Aarambam.cli:example_basis"
Aarambam-make-example-config-resbasis = "Aarambam.cli:example_resbasis"
Aarambam-make-example-config-binned   = "Aarambam.cli:example_binned"

[tool.scikit-build]
# helpful verbosity and wheel tweaks
build.verbose = true
# C sources (src/lpt) are outside the package; the Cython sources are not needed at runtime
wheel.exclude = ["**/*.pyx", "**/*.c", "**/*.h"]
