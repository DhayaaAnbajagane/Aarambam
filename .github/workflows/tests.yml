name: tests

# Python-only tests from the source tree. The 2LPT executables need FFTW3 (with MPI) + MPI + GSL and the
# Legendre backend needs the compiled Cython extension, so neither is built here: tests marked
# `mpi` skip themselves, and tests/conftest.py imports the pure-Python modules directly.

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: python -m pip install "numpy>=1.22" "scipy>=1.12" tqdm joblib threadpoolctl pytest
      - name: Run tests
        env:
          OMP_NUM_THREADS: "2"
        run: python -m pytest tests -m "not mpi" -q
